doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
  orm:
    auto_generate_proxy_classes: true
    enable_native_lazy_objects: true
    mappings:
      App:
        type: xml
        dir: '%kernel.project_dir%/src/MailProcessing/Infrastructure/Mapping'
        prefix: App\MailProcessing\Domain
doctrine_migrations:
  migrations_paths:
    DoctrineMigrations: '%kernel.project_dir%/migrations'
  enable_profiler: false
